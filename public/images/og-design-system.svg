<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#ffd93d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative blobs -->
  <circle cx="980" cy="100" r="220" fill="#4ecdc4" opacity="0.07" filter="url(#glow)"/>
  <circle cx="120" cy="530" r="180" fill="#ff5e5e" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="600" r="150" fill="#ffd93d" opacity="0.05" filter="url(#glow)"/>

  <!-- Left teal accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accentGrad)"/>

  <!-- Top label -->
  <text x="72" y="90" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="4" fill="#4ecdc4" text-transform="uppercase">CRUISEANDTHEMEPARKGUIDE.COM</text>

  <!-- Main heading -->
  <text x="72" y="200" font-family="Georgia, serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-1">CTPG Design System</text>

  <!-- Subheading -->
  <text x="72" y="270" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="600" fill="rgba(255,255,255,0.7)">Component Library &amp; Brand Style Guide</text>

  <!-- Divider line -->
  <rect x="72" y="306" width="80" height="4" fill="#4ecdc4" rx="2"/>

  <!-- Description -->
  <text x="72" y="360" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.55)">Buttons · Typography · Cards · Forms · Navigation · Alerts</text>
  <text x="72" y="392" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.55)">Tabs · Tables · Hero Sections · Pricing · Modals &amp; more</text>

  <!-- Color swatches -->
  <circle cx="72"  cy="480" r="22" fill="#334155"/>
  <circle cx="72"  cy="480" r="22" fill="#334155" stroke="#4ecdc4" stroke-width="2"/>
  <circle cx="128" cy="480" r="22" fill="#4ecdc4"/>
  <circle cx="184" cy="480" r="22" fill="#ffd93d"/>
  <circle cx="240" cy="480" r="22" fill="#ff5e5e"/>
  <circle cx="296" cy="480" r="22" fill="#1e293b" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Swatch label -->
  <text x="72" y="530" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.35)" letter-spacing="2">BRAND PALETTE</text>

  <!-- Right: URL badge -->
  <rect x="840" y="540" width="320" height="50" rx="8" fill="rgba(78,205,196,0.12)" stroke="#4ecdc4" stroke-width="1.5"/>
  <text x="1000" y="572" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="700" fill="#4ecdc4" text-anchor="middle" letter-spacing="1">media.cruiseandthemeparkguide.com</text>

  <!-- Right: decorative mini component mockup -->
  <rect x="800" y="120" width="340" height="56" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="816" y="136" width="60" height="24" rx="4" fill="#ff5e5e"/>
  <rect x="886" y="136" width="80" height="24" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="976" y="136" width="60" height="24" rx="4" fill="#4ecdc4"/>

  <rect x="800" y="196" width="340" height="80" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="816" y="212" width="180" height="12" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="816" y="234" width="130" height="12" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="816" y="252" width="100" height="8" rx="3" fill="rgba(78,205,196,0.3)"/>

  <rect x="800" y="296" width="340" height="60" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="816" y="312" width="308" height="10" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="816" y="330" width="220" height="10" rx="3" fill="rgba(255,255,255,0.06)"/>

  <rect x="800" y="376" width="340" height="140" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(78,205,196,0.25)" stroke-width="1.5"/>
  <rect x="800" y="376" width="340" height="40" rx="8" fill="rgba(78,205,196,0.1)"/>
  <rect x="816" y="390" width="100" height="12" rx="3" fill="rgba(78,205,196,0.5)"/>
  <rect x="816" y="432" width="280" height="8" rx="3" fill="rgba(255,255,255,0.08)"/>
  <rect x="816" y="450" width="200" height="8" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="816" y="468" width="240" height="8" rx="3" fill="rgba(255,255,255,0.08)"/>
</svg>
